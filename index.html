<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Pueblo's Yuletide Voyage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: sticky pill tab bar; each port panel re-themes one card system with its own art palette. Single bright light theme by design. */
:root{
  color-scheme: light;
  --bg:#F3FBFA; --ink:#1E1240; --soft:#5C527A;
  --pink:#FF3D7F; --sun:#FFC21A; --teal:#00B3A6; --orange:#FF7A1A; --violet:#7B4DFF;
  --red:#D7263D; --green:#1E8A4C; --gold:#D4A017;
  --card:#FFFFFF; --chip:#EDF6F5;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --p1:var(--pink); --p2:var(--sun); --p3:#FFE6EF;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
img{max-width:100%}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* tab bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ink)}
.bar .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.bar .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-family:var(--display);font-size:15px;border:2px solid transparent;border-radius:999px;padding:7px 14px;background:#2E2160;color:#fff;cursor:pointer}
.tab[aria-selected="true"]{background:var(--tc,var(--sun));color:var(--ink);border-color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

main{padding-block:18px 60px}
section.panel{display:flex;flex-direction:column;gap:18px}

/* nameplates */
.me-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;padding-top:10px}
@media (min-width:640px){.me-strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.me-strip .lbl{grid-column:1/-1;font-size:12px;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:-6px}
.me-strip .np{width:100%;font-size:17px;padding:6px 14px 6px 6px;min-height:52px}
.me-strip .np .np-av{width:36px;height:36px;font-size:15px}
.me-strip .np[aria-pressed="true"]{background:var(--c);color:#fff}
.me-strip .np[aria-pressed="true"] .np-av{background:#fff;color:var(--c)}
.np{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px 4px 4px;background:#fff;font-weight:900;font-family:var(--body);font-size:14px;color:var(--ink);line-height:1.2;white-space:nowrap}
button.np{cursor:pointer}
.np-av{position:relative;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px;flex:0 0 auto}
.np i{font-style:normal;pointer-events:none}
.np .hat{position:absolute;top:-13px;left:-7px;font-size:17px;transform:rotate(-22deg)}
.np .crown{position:absolute;top:-15px;left:2px;font-size:17px}
.np .holly{font-size:13px}
.np .spark{position:absolute;top:-8px;right:-6px;font-size:13px;opacity:0}
.np[aria-pressed="true"]{outline:3px solid var(--c);outline-offset:3px}
.np.t2{box-shadow:0 0 0 3px var(--green)}
.np.t3{box-shadow:0 0 0 3px var(--green)}
.np.t3::before{content:"";position:absolute;inset:-9px;border-radius:999px;z-index:-1;
  background:radial-gradient(circle,#FF4040 2.6px,transparent 3.2px) 0 0/16px 9px repeat-x,radial-gradient(circle,#FFD23F 2.6px,transparent 3.2px) 8px 0/16px 9px repeat-x,
             radial-gradient(circle,#2BD46B 2.6px,transparent 3.2px) 4px 100%/16px 9px repeat-x,radial-gradient(circle,#4DA3FF 2.6px,transparent 3.2px) 12px 100%/16px 9px repeat-x}
.np.t4{border-color:var(--gold);box-shadow:0 0 0 3px #F6D365;background:linear-gradient(#FFF8E1,#fff)}
.np.t4 .spark,.np.t5 .spark{animation:spark 7s ease-in-out infinite}
.np.t5{border:3px solid transparent;background:linear-gradient(#FFF8E1,#FFF8E1) padding-box,repeating-linear-gradient(45deg,#E8384F 0 6px,#fff 6px 12px,#1E8A4C 12px 18px,#fff 18px 24px) border-box;box-shadow:0 0 0 3px var(--gold),0 0 14px #FFD45A}
@keyframes spark{0%,86%,100%{opacity:0;transform:scale(.4)}90%{opacity:1;transform:scale(1.2) rotate(20deg)}95%{opacity:0}}
.np.pop{animation:npPop .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes npPop{0%{transform:scale(1)}30%{transform:scale(1.28) rotate(-4deg)}60%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1)}}
.np-title{display:block;font-size:12px;font-weight:800;color:var(--soft);margin-top:4px}
.np-title b{color:var(--violet)}

/* hero */
.hero{position:relative;border:3px solid var(--ink);border-radius:26px;overflow:hidden;background:linear-gradient(160deg,#00B3A6 0%,#14C2D1 40%,#FFC21A 100%);box-shadow:6px 6px 0 var(--ink)}
.hero-in{position:relative;padding:22px 20px 20px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}
.hero h1{font-size:clamp(36px,9vw,66px);line-height:.95;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.hero p{margin:0;font-weight:700;max-width:54ch}
.count{display:flex;gap:10px;flex-wrap:wrap}
.count div{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 12px;text-align:center;min-width:70px}
.count b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.sunburst{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:repeating-conic-gradient(var(--pink) 0 10deg,transparent 10deg 20deg);opacity:.35}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.box{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:4px 4px 0 var(--ink);min-width:0}
.box h2{font-size:24px;margin-bottom:6px}
.sub{color:var(--soft);font-size:13px;font-weight:700;margin:0}

/* weather scroller */
.wx{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 2px 8px;margin-top:4px}
.pchip{flex:0 0 160px;scroll-snap-align:start;display:flex;flex-direction:column;gap:2px;text-decoration:none;border:2px solid var(--ink);border-radius:16px;padding:10px 12px;background:var(--pc);color:var(--ink)}
.pchip b{font-family:var(--display);font-size:18px}
.pchip .t{font-family:var(--mono);font-size:12px}
.pchip .w{font-weight:800;font-size:13px}
.windy{flex:0 0 min(86vw,560px);scroll-snap-align:start;border:2px solid var(--ink);border-radius:16px;overflow:hidden;background:#0B2545;color:#fff;display:flex;flex-direction:column}
.windy iframe{width:100%;height:300px;border:0;display:block;background:#0B2545}
.windy .cap{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;font-weight:800;font-size:13px}
.windy .cap a{color:#FFD45A}
.windy.link{justify-content:center;align-items:flex-start;gap:6px;padding:14px;text-decoration:none;flex-basis:220px}
.windy.link b{font-family:var(--display);font-size:20px}
.swipe{font-size:12px;color:var(--soft);font-weight:800}

.map svg{width:100%;height:auto;display:block}
.map .stop{cursor:pointer}

.hot{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.hot li{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:14px;padding:8px 10px;background:var(--hc,#fff);min-width:0}
.hot .n{font-family:var(--display);font-size:20px;width:28px;text-align:center;flex:0 0 auto}
.hot .tt{flex:1;min-width:0;font-weight:800}
.hot .tt small{display:block;font-weight:700;color:var(--soft)}
.dots{display:inline-flex}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid #fff;margin-left:-6px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:10px;font-weight:900}
.dots i:first-child{margin-left:0}
.empty{border:2px dashed var(--soft);border-radius:14px;padding:12px;color:var(--soft);font-weight:700;margin:0}

/* status */
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 10px;margin-top:10px}
.st{border:2px solid var(--ink);border-radius:14px;padding:12px 10px 10px;background:#fff;min-width:0}
.st .where{font-weight:800;font-size:15px;overflow-wrap:anywhere;margin-top:6px}
.st .ago{font-size:12px;color:var(--soft);font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qbtn,.btn{font-family:var(--body);font-weight:900;font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:7px 13px;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--pink);color:#fff;box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-weight:400;font-size:17px}
.btn.gold{background:var(--sun)}
.btn.ghost{border-style:dashed;color:var(--soft)}
.qbtn:active,.btn:active{transform:translate(1px,1px)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input[type=text],select{font-family:var(--body);font-size:15px;font-weight:700;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0;max-width:100%}
.row input[type=text],.row select{flex:1 1 160px}

/* deck the hulls */
.hulls{background:linear-gradient(170deg,#12245B,#2C4AA8);color:#fff;border:3px solid var(--ink);border-radius:22px;padding:18px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hulls h2{font-size:28px;color:#FFD45A;text-shadow:2px 2px 0 #000}
.hulls p{margin:0;font-weight:700;max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stat{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:8px 10px}
.stat span{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--soft)}
.stat b{font-family:var(--display);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:11.5px;font-weight:700;color:var(--soft)}
.hulls .garland{position:absolute;left:0;right:0;top:0;height:12px;background:radial-gradient(circle,#FF4040 3px,transparent 3.6px) 0 0/22px 12px,radial-gradient(circle,#2BD46B 3px,transparent 3.6px) 11px 0/22px 12px}

/* port hero */
.phero{position:relative;border:3px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);color:var(--ink)}
.phero .in{position:relative;padding:20px;display:flex;flex-direction:column;gap:8px;z-index:1}
.phero h1{font-size:clamp(36px,9vw,60px);line-height:.95}
.phero .times{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-family:var(--mono);font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:#fff;color:var(--ink)}
.pill.warn{background:var(--sun)}
.phero .art{position:absolute;right:0;bottom:0;width:min(46%,280px);height:auto}
.phero p.blurb{margin:0;font-weight:700;max-width:52ch}
.th-cabo{--p1:#1546C7;--p2:#FF6B3D;--p3:#FFE1C9}
.th-cabo .phero{background:linear-gradient(180deg,#FF9A5C 0%,#FF6B3D 38%,#C2307A 70%,#1546C7 100%);color:#fff}
.th-cabo .phero h1{color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.th-cabo .phero p.blurb{text-shadow:0 1px 2px rgba(0,0,0,.5)}
.th-maz{--p1:#2C3E9A;--p2:#F47CA6;--p3:#E3F6F2}
.th-maz .phero{background:#BFEDE6}
.th-maz .phero h1{color:#2C3E9A}
.th-pv{--p1:#E6007E;--p2:#00A6D6;--p3:#FFF6C2}
.th-pv .phero{background:#FFD200}
.th-pv .phero::before{content:"";position:absolute;inset:0;background:conic-gradient(from 45deg at 50% 50%,#E6007E 0 25%,#00A6D6 0 50%,#00A651 0 75%,#FF7A1A 0) 0 0/36px 36px;opacity:.28;-webkit-mask:linear-gradient(90deg,transparent 30%,#000 100%);mask:linear-gradient(90deg,transparent 30%,#000 100%)}
.th-pv .phero h1{color:#E6007E;-webkit-text-stroke:1.5px var(--ink)}
.th-ship{--p1:#12245B;--p2:#E8384F;--p3:#E8EEFF}
.th-ship .phero{background:radial-gradient(circle at 20% 20%,#2C4AA8,#12245B 70%);color:#fff}
.th-ship .phero h1{color:#FFD45A;text-shadow:3px 3px 0 #000}
.th-ship .phero .art{opacity:.45;width:min(40%,240px)}
.th-ship .phero p.blurb{background:rgba(10,20,60,.82);border:2px solid #000;border-radius:14px;padding:10px 12px;color:#fff}
.th-ship .phero .eyebrow{color:#FFD45A}
.papel{display:flex;position:relative;z-index:1;margin:-3px -3px 0}
.papel span{flex:1;height:34px;clip-path:polygon(0 0,100% 0,100% 70%,85% 100%,70% 70%,50% 100%,30% 70%,15% 100%,0 70%)}
.tip{border:2px solid var(--ink);border-radius:16px;background:var(--p3);padding:12px 14px;font-weight:700;display:flex;gap:10px}
.tip b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--p1)}

/* quests */
.qlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.quest{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff;cursor:pointer;font-family:var(--body);font-weight:800;font-size:14px;color:var(--ink)}
.quest .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;background:#fff;flex:0 0 auto}
.quest .qt{flex:1;min-width:0}
.quest .qt small{display:block;font-size:12px;color:var(--violet);font-weight:900}
.quest .qt small.lock{color:var(--soft);font-weight:800}
.quest.done{background:var(--p3)}
.quest.done .ck{background:var(--p2);color:#fff}
.quest.pending .ck{background:var(--sun)}
.quest .dots i{width:20px;height:20px;font-size:9px}
details.secret{border:2px dashed var(--ink);border-radius:14px;padding:8px 10px;margin-top:8px;background:repeating-linear-gradient(45deg,#fff 0 10px,#FFF3F6 10px 20px)}
details.secret summary{cursor:pointer;font-weight:900}
.witness{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:14px;padding:10px;background:#FFF6D6}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;font-family:var(--body);font-weight:900;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;background:#fff;color:var(--ink);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--p1);color:#fff}

/* activity cards */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.act{display:flex;flex-direction:column;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:4px 4px 0 var(--p1);min-width:0;position:relative}
.act.voted{background:var(--p3)}
.act .rank{position:absolute;top:-12px;right:12px;background:var(--p2);color:#fff;border:2px solid var(--ink);border-radius:999px;font-family:var(--display);font-size:13px;padding:2px 10px}
.act h3{font-size:20px;line-height:1.1}
.act p{margin:0;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:900;border-radius:999px;padding:2px 9px;background:var(--chip);border:1.5px solid var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;font-weight:800;color:var(--soft)}
.meta a{color:var(--p1)}
.act-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px}
.want{font-family:var(--display);font-size:16px;border:2.5px solid var(--ink);border-radius:999px;padding:7px 14px;background:var(--p2);color:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.want:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.want.on{background:var(--ink)}
.extlinks{display:flex;flex-wrap:wrap;gap:8px}
.ext{font-weight:900;font-size:13px;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;background:#fff}

/* schedule */
.days{display:flex;flex-direction:column;gap:14px}
.day{position:relative;display:grid;grid-template-columns:76px 1fr;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:4px 4px 0 var(--dc)}
.date{border:2px solid var(--ink);border-radius:14px;background:var(--dc);text-align:center;padding:6px 4px;align-self:start}
.date b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.date span{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.day h3{font-size:21px}
.day .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.day ul{margin:0;padding-left:18px;font-size:14px;font-weight:700}
.day .plan{display:flex;gap:8px;align-items:baseline;font-size:14px;font-weight:700}
.day .plan .tm{font-family:var(--mono);font-size:12px;color:var(--soft);flex:0 0 auto}
.day .plan .x{border:0;background:none;color:var(--soft);cursor:pointer;font-weight:900;font-size:14px;padding:0 4px}
.lab{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--soft)}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{font-size:12.5px;font-weight:800;border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px;background:var(--bg)}
/* Christmas Day, fully decked */
.day.xmas{background:linear-gradient(180deg,#B3122E,#7A0C1F);color:#fff;border:4px solid transparent;
  background:linear-gradient(180deg,#B3122E,#7A0C1F) padding-box,repeating-linear-gradient(135deg,#fff 0 10px,#D7263D 10px 20px,#fff 20px 30px,#1E8A4C 30px 40px) border-box;
  box-shadow:0 0 0 3px var(--gold),6px 6px 0 var(--ink);padding-top:34px;overflow:hidden}
.day.xmas::before{content:"";position:absolute;left:0;right:0;top:4px;height:16px;
  background:radial-gradient(circle,#FF4040 4px,transparent 4.6px) 0 0/28px 16px,radial-gradient(circle,#FFD23F 4px,transparent 4.6px) 7px 0/28px 16px,radial-gradient(circle,#2BD46B 4px,transparent 4.6px) 14px 0/28px 16px,radial-gradient(circle,#4DA3FF 4px,transparent 4.6px) 21px 0/28px 16px;
  animation:twinkle 2.4s steps(2) infinite}
.day.xmas::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;border-bottom:2px solid #0E5A2E;border-radius:0 0 50% 50%/0 0 100% 100%}
@keyframes twinkle{50%{filter:brightness(1.6) saturate(1.3)}}
.day.xmas .date{background:#FFD45A;color:var(--ink)}
.day.xmas h3{font-size:26px;color:#FFD45A;text-shadow:2px 2px 0 #000}
.day.xmas ul{font-weight:800}
.day.xmas .note,.day.xmas .lab{color:#FFE7EC}
.day.xmas .mini span{background:#fff;color:var(--ink)}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-20px;color:#fff;font-style:normal;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(420px) rotate(180deg)}}
.orn{position:absolute;right:14px;bottom:10px;font-size:34px;filter:drop-shadow(2px 2px 0 #000)}

 cabo:{name:"Cabo San Lucas",short:"Cabo",date:"Mon Dec 21",time:"12:00 PM – 8:00 PM",pc:"#FFB48A",hi:"27°",lo:"17°",sea:"24°",tz:"Baja California Sur",

function normalize(d){
 const st={picks:{},plans:[],status:{},ach:{},titles:{},proofs:[],pins:{}};
 Object.entries(d?.picks||{}).forEach(([k,v])=>{if(Array.isArray(v)&&v.length)st.picks[k]=v.filter(n=>NAMES.includes(n))});
 st.plans=Array.isArray(d?.plans)?d.plans:[];
 Object.values(d?.status||{}).forEach(s=>{if(s&&NAMES.includes(s.who))st.status[s.who]=s});
 Object.entries(d?.ach||{}).forEach(([n,m])=>{if(NAMES.includes(n))st.ach[n]={...m}});
 Object.entries(d?.quests||{}).forEach(([q,ns])=>{const id=LEGACY[q];if(!id)return;(ns||[]).forEach(n=>{if(!NAMES.includes(n))return;(st.ach[n]||(st.ach[n]={}));if(!st.ach[n][id])st.ach[n][id]={ts:Date.now()}})});
 Object.entries(d?.titles||{}).forEach(([n,id])=>{if(NAMES.includes(n)&&ACHBY[id])st.titles[n]=id});
 st.proofs=(Array.isArray(d?.proofs)?d.proofs:[]).filter(p=>p&&p.id&&p.photo&&NAMES.includes(p.about)&&NAMES.includes(p.by));
 Object.entries(d?.pins||{}).forEach(([n,id])=>{if(NAMES.includes(n)&&st.proofs.some(p=>p.id===id&&p.about===n))st.pins[n]=id});
 return st;
}
function applyOp(st,op){
 const who=op.who;if(!NAMES.includes(who))return;
 switch(op.op){
  case "pick":{const a=new Set(st.picks[op.id]||[]);op.on?a.add(who):a.delete(who);if(a.size)st.picks[op.id]=[...a];else delete st.picks[op.id];break}
  case "status":st.status[who]={who,where:op.where,venue:op.venue||null,ts:Date.now()};break;
  case "plan":st.plans.push({id:op.pid,day:op.day,time:op.time,what:op.what,who,ts:Date.now()});break;
  case "unplan":st.plans=st.plans.filter(p=>!(p.id===op.id&&p.who===who));break;
  case "ach":{const m=st.ach[who]||(st.ach[who]={});if(op.on){if(!m[op.id])m[op.id]={ts:Date.now(),...(op.pending?{pending:true}:{})}}else{delete m[op.id];if(st.titles[who]===op.id)delete st.titles[who]}break}
  case "witness":{const e=st.ach[op.target]?.[op.id];if(e&&e.pending&&op.target!==who){delete e.pending;e.wit=who;e.ts=Date.now()}break}
  case "proof":st.proofs.push({id:op.pid,about:op.about,by:who,ach:ACHBY[op.ach]?op.ach:null,caption:op.caption||"",photo:op.photo,ts:Date.now()});break;
  case "unproof":{const p=st.proofs.find(x=>x.id===op.id);if(p&&(p.by===who||p.about===who)){st.proofs=st.proofs.filter(x=>x!==p);if(st.pins[p.about]===p.id)delete st.pins[p.about]}break}
  case "pin":{if(!op.id)delete st.pins[who];else if(st.proofs.some(x=>x.id===op.id&&x.about===who))st.pins[who]=op.id;break}
  case "title":{if(!op.id)delete st.titles[who];else if(st.ach[who]?.[op.id]&&!st.ach[who][op.id].pending)st.titles[who]=op.id;break}
 }
}

}

let dbParts={picks:{},plans:[],status:{},ach:{},titles:{},quests:{},proofs:[],pins:{}};
const LEGACY_REV={};Object.entries(LEGACY).forEach(([q,id])=>LEGACY_REV[id]=q);
function dbCompose(){S=normalize({picks:dbParts.picks,plans:dbParts.plans,status:dbParts.status,ach:dbParts.ach,titles:dbParts.titles,quests:dbParts.quests,proofs:dbParts.proofs,pins:dbParts.pins});afterChange()}
function dbSubscribe(){
 const seen=new Set();const on=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...(d.data()||{})})));seen.add(col);if(seen.size>=8)ready=true;dbCompose()},()=>{seen.add(col)});
 on("picks",docs=>{const m={};docs.forEach(x=>{if(x.act&&x.who)(m[x.act]||(m[x.act]=[])).push(x.who)});dbParts.picks=m});
 on("quests",docs=>{const m={};docs.forEach(x=>{if(x.q&&x.who)(m[x.q]||(m[x.q]=[])).push(x.who)});dbParts.quests=m});
 on("plans",docs=>{dbParts.plans=docs.filter(x=>x.what)});
 on("status",docs=>{const m={};docs.forEach(x=>{if(x.who)m[x.who]=x});dbParts.status=m});
 on("ach",docs=>{const m={};docs.forEach(x=>{if(x.ach&&x.who){(m[x.who]||(m[x.who]={}))[x.ach]={ts:x.ts,...(x.pending?{pending:true}:{}),...(x.wit?{wit:x.wit}:{})}}});dbParts.ach=m});
 on("titles",docs=>{const m={};docs.forEach(x=>{if(x.who&&x.id)m[x.who]=x.id});dbParts.titles=m});
 on("proofs",docs=>{dbParts.proofs=docs.filter(x=>x.photo).sort((a,b)=>(a.ts||0)-(b.ts||0))});
 on("pins",docs=>{const m={};docs.forEach(x=>{if(x.who&&x.id)m[x.who]=x.id});dbParts.pins=m});
}
async function dbWrite(op){
 const w=op.who;
 if(op.op==="pick"){const r=db.doc("picks/"+op.id+"__"+w);return op.on?r.set({act:op.id,who:w,ts:Date.now()}):r.delete()}
 if(op.op==="status")return db.doc("status/"+w).set({who:w,where:op.where,venue:op.venue||null,ts:Date.now()});
 if(op.op==="plan")return db.doc("plans/"+op.pid).set({day:op.day,time:op.time,what:op.what,who:w,ts:Date.now()});
 if(op.op==="unplan")return db.doc("plans/"+op.id).delete();
 if(op.op==="ach"){const r=db.doc("ach/"+op.id+"__"+w);
  if(op.on)return r.set({ach:op.id,who:w,ts:Date.now(),pending:!!op.pending});
  await r.delete();const q=LEGACY_REV[op.id];if(q)await db.doc("quests/"+q+"__"+w).delete();
  if(dbParts.titles[w]===op.id)await db.doc("titles/"+w).delete();return}
 if(op.op==="witness"){const e=S.ach[op.target]?.[op.id];return db.doc("ach/"+op.id+"__"+op.target).set({ach:op.id,who:op.target,ts:Date.now(),pending:false,wit:w})}
 if(op.op==="proof")return db.doc("proofs/"+op.pid).set({about:op.about,by:w,ach:op.ach||null,caption:op.caption||"",photo:op.photo,ts:Date.now()});
 if(op.op==="unproof"){await db.doc("proofs/"+op.id).delete();for(const [n,id] of Object.entries(dbParts.pins))if(id===op.id)await db.doc("pins/"+n).delete();return}
 if(op.op==="pin")return op.id?db.doc("pins/"+w).set({who:w,id:op.id}):db.doc("pins/"+w).delete();
 if(op.op==="title")return op.id?db.doc("titles/"+w).set({who:w,id:op.id}):db.doc("titles/"+w).delete();
}

const FLAIR={"a-ch-abby":XANAX,"a-sh-captain":"⚓","a-ch-miracle":"🎄✨","a-sh-stand":"🌟","a-maz-dive":"🫣","a-pv-whale":"🐋","a-ch-buffet":"🍤","a-sh-casino":"💸","a-ch-left":"⏱️"};
const flairOf=p=>p.ach?(FLAIR[p.ach]||ACHBY[p.ach]?.e||"🏆"):p.by!==p.about?"🗳️":"🎖️";
function proofTag(p){const a=ACHBY[p.ach];const nom=p.by!==p.about;return (a?`${a.e} ${esc(a.t)}`:nom?"":"🎖️ Honourable mention")+(nom?`${a?"<br>":""}🗳️ Nominated by ${esc(p.by)}`:"")}
function proofCard(p,i=0){const rot=[-2.2,1.6,-1,2.4,-1.8,1][i%6];
 return `<button class="proof" style="--rot:${rot}deg" data-proof="${esc(p.id)}"><span class="tape" aria-hidden="true"></span><img src="${esc(photoUrl(p.photo))}" alt="${esc(p.caption||"Proof photo")}" loading="lazy"><span class="flair" aria-hidden="true">${flairOf(p)}</span><span class="ptag">${proofTag(p)}</span>${p.caption?`<span class="pcap">${esc(p.caption)}</span>`:""}<span class="pmeta">📸 ${esc(p.by)} · ${fdate(p.ts)}</span></button>`}
const proofsOf=n=>S.proofs.filter(p=>p.about===n).sort((a,b)=>b.ts-a.ts);
let profileOf=null;
function openCabinet(n){
 profileOf=n;const isMe=n===me;const c=countOf(n);const list=proofsOf(n);const pin=S.proofs.find(p=>p.id===S.pins[n]);
 modal(`<div class="sheet"><button class="close" data-close aria-label="Close">✕</button>
  <div>${nameplate(n)}${titleLine(n)}</div><h2>${esc(n)}'s hall of fame</h2><p class="sub">${c} achievement${c===1?"":"s"} · ${esc(TIERS[tierOf(c)].name)}</p>
  ${pin?`<div class="defining"><span class="lbl">🏆 Defining Moment</span>${proofCard(pin)}</div>`:isMe?`<p class="empty">Pin one photo below as your 🏆 Defining Moment. It goes right here.</p>`:""}
  <h3 style="font-size:22px">Proof of Legendary Behaviour</h3>
  ${me?`<div><button class="btn primary" data-addproof="${n}">${isMe?"📸 Add proof":`🗳️ Add evidence for ${esc(n)}`}</button></div>`:`<p class="note">Pick your name first to add photos.</p>`}
  ${list.length?`<div class="proofs">${list.map(proofCard).join("")}</div>`:`<p class="empty">No evidence yet. Suspicious.</p>`}
  <h3 style="font-size:22px;margin-top:8px">Trophy cabinet</h3>
  ${isMe&&S.titles[n]?`<div><button class="btn ghost" data-equip="">Remove my title</button></div>`:""}
  ${Object.entries(GROUPS).map(([g,label])=>`<div class="cab-group"><h3>${label}</h3>${ACH.filter(a=>a.g===g&&(revealed(a)||has(n,a.id))).map(a=>{const e=S.ach[n]?.[a.id];const got=e&&!e.pending;
   return `<div class="cab ${got?"":"off"}"><span class="ic">${got?a.e:"🔒"}</span><span class="tx">${got?esc(a.t):e?.pending?"Waiting for a witness":"???"}<small>${esc(a.q)}${got?` · ${fdate(e.ts)}${e.wit?` · witnessed by ${esc(e.wit)}`:""}`:""}</small></span>${isMe&&got?(S.titles[n]===a.id?`<span class="tag">Equipped</span>`:`<button class="btn eq" data-equip="${a.id}">Equip</button>`):""}</div>`}).join("")}</div>`).join("")}
 </div>`);
}
function openProof(id){
 const p=S.proofs.find(x=>x.id===id);if(!p)return;const owner=me===p.about,can=me&&(me===p.by||owner);const pinned=S.pins[p.about]===p.id;
 modal(`<div class="sheet lightbox"><button class="close" data-close aria-label="Close">✕</button>
  <img src="${esc(photoUrl(p.photo))}" alt="${esc(p.caption||"Proof photo")}">
  <p class="ptag" style="margin:0;font-weight:900;color:var(--violet)">${proofTag(p)}</p>
  ${p.caption?`<p style="margin:0;font-weight:800;font-size:17px">${esc(p.caption)}</p>`:""}
  <p class="note">On ${esc(p.about)}'s profile · 📸 ${esc(p.by)} · ${fdate(p.ts)}</p>
  <div class="row">${owner?`<button class="btn gold" data-pin="${pinned?"":esc(p.id)}">${pinned?"Unpin Defining Moment":"📌 Make this my Defining Moment"}</button>`:""}
   ${can?`<button class="btn ghost" data-unproof="${esc(p.id)}">🗑️ Remove</button>`:""}
   <button class="btn" data-cabinet="${esc(p.about)}">← Back to ${esc(p.about)}</button></div></div>`);
}
function openAddProof(n){
 const isMe=n===me;const mine=ACH.filter(a=>has(n,a.id)),rest=ACH.filter(a=>!has(n,a.id)&&revealed(a));
 modal(`<div class="sheet"><button class="close" data-close aria-label="Close">✕</button>
  <h2>${isMe?"Add proof":`Evidence for ${esc(n)}`}</h2>
  <p class="sub">${isMe?"Link it to an achievement, or leave it as an honourable mention.":`This goes on ${esc(n)}'s profile as a nomination from you.`}</p>
  <form class="pform" id="proof-form">
   <label for="proof-file">Photo</label><input type="file" id="proof-file" accept="image/*" required>
   <img id="proof-prev" alt="" hidden>
   <label for="proof-cap">Caption</label><input type="text" id="proof-cap" maxlength="140" placeholder="What are we looking at here?">
   <label for="proof-ach">Link an achievement</label>
   <select id="proof-ach"><option value="">${isMe?"🎖️ None, honourable mention":"🗳️ None, just a nomination"}</option>
    ${mine.length?`<optgroup label="${esc(n)} has earned">${mine.map(a=>`<option value="${a.id}">${a.e} ${esc(a.t)}</option>`).join("")}</optgroup>`:""}
    <optgroup label="Other achievements">${rest.map(a=>`<option value="${a.id}">${a.e} ${esc(a.t)}</option>`).join("")}</optgroup></select>
   <input type="hidden" id="proof-about" value="${esc(n)}">
   <div class="row"><button class="btn primary" type="submit" id="proof-go">Post it 📸</button><button class="btn" type="button" data-cabinet="${esc(n)}">Cancel</button></div>
  </form></div>`);
}
async function submitProof(){
 const f=$("#proof-file").files[0];if(!f)return toast("Pick a photo first");
 const btn=$("#proof-go");btn.disabled=true;btn.textContent="Uploading…";
 try{const photo=await uploadPhoto(f);const about=$("#proof-about").value;
  await send({op:"proof",about,ach:$("#proof-ach").value||null,caption:$("#proof-cap").value.trim().slice(0,140),photo});
  toast("Evidence filed 📸");confetti(80);openCabinet(about);
 }catch(e){btn.disabled=false;btn.textContent="Post it 📸";toast(String(e.message)==="noassets"?"Photo uploads need edit access to this page. Ask Mauro to share it with you as an editor.":"Couldn't upload that photo. Try again.")}
}

/* ================= ACHIEVEMENT FLOW ================= */
function tapQuest(id){
 if(needMe())return;const a=ACHBY[id];
 if(has(me,id)||pend(me,id))return showEarned(id);
 if(a.auto){toast(a.id==="a-ex-nerd"?"Read every Ship Nerd Mode card to unlock this.":"This one unlocks automatically.");return}
 send({op:"ach",id,on:true,pending:!!a.w});
 if(a.w){popup(id,true)}else celebrate(id);
}
function showEarned(id){
 const a=ACHBY[id],e=S.ach[me]?.[id];
 modal(`<div class="sheet ach-pop"><button class="close" data-close aria-label="Close">✕</button><div class="big">${a.e}</div><span class="unl">${e?.pending?"Waiting for a witness":"Achievement unlocked"}</span><h2>${e?.pending?"???":esc(a.t)}</h2><p style="margin:0;font-weight:700">${esc(a.q)}${e?` · ${fdate(e.ts)}`:""}</p>
  <div class="row" style="justify-content:center">${!e?.pending&&S.titles[me]!==id?`<button class="btn gold" data-equip="${id}">Equip as my title</button>`:""}${a.auto?"":`<button class="btn ghost" data-undo="${id}">Undo, I didn't do this</button>`}</div></div>`);
}
function popup(id,pending){
 const a=ACHBY[id];
 modal(`<div class="sheet ach-pop"><button class="close" data-close aria-label="Close">✕</button><div class="big">${pending?"👀":a.e}</div>
  <span class="unl">${pending?"Almost!":"Achievement unlocked"}</span><h2>${pending?"Needs a witness":esc(a.t)}</h2>
  <p style="margin:0;font-weight:700">${pending?"Get another Pueblo member to open this page and tap Witnessed it. Then the achievement reveals itself.":esc(a.q)}</p>
  <div class="row" style="justify-content:center">${pending?"":`<button class="btn gold" data-equip="${id}">Equip as my title</button>`}<button class="btn primary" data-close>Nice 🎉</button>${a.auto?"":`<button class="btn ghost" data-undo="${id}">Undo</button>`}</div></div>`);
}
function celebrate(id){
 popup(id,false);
 if(id==="a-ch-miracle")miracle();else confetti(140);
}
function miracle(){
 const m=document.createElement("div");m.className="miracle";m.innerHTML=`<h1>🎄 IT'S A CHRISTMAS MIRACLE 🎄</h1>`;document.body.appendChild(m);
 confetti(420,5200,true);jingle();setTimeout(()=>m.remove(),3600);
}
function jingle(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ac=new C();const notes=[659,659,659,659,659,659,659,784,523,587,659];const lens=[.2,.2,.4,.2,.2,.4,.2,.2,.3,.1,.6];let t=ac.currentTime+.05;
 notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+lens[i]);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+lens[i]+.05);t+=lens[i]});setTimeout(()=>ac.close(),5000)}catch(e){}}
function confetti(n=140,dur=2600,snow=false){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cv=$("#fx"),ctx=cv.getContext("2d"),W=cv.width=innerWidth,H=cv.height=innerHeight;
 const cols=["#FF3D7F","#FFC21A","#00B3A6","#7B4DFF","#D7263D","#1E8A4C","#fff"];
 const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,s:snow&&Math.random()<.4}));
 const t0=performance.now();
 (function f(t){const k=t-t0;ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=.15;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;if(p.s){ctx.font=`${p.r*3}px serif`;ctx.fillText("❄",0,0)}else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
 if(k<dur)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})(t0);
}
function modal(html){$("#modal").innerHTML=`<div class="ovl" data-ovl>${html}</div>`}
function closeModal(){$("#modal").innerHTML=""}

/* auto achievements + nerd reading */
const readKey=()=>"nerd:"+(me||"");
function readSet(){try{return new Set(JSON.parse(LS.get(readKey())||"[]"))}catch(e){return new Set()}}
let autoBusy=false;
function reconcileAuto(){
 if(!me||!ready||autoBusy)return;
 const earned=countOf(me);
 const ports=["cabo","maz","pv"].every(g=>ACH.some(a=>a.g===g&&has(me,a.id)));
 const ten=earnedOf(me).filter(([id])=>id!=="a-ch-ten").length>=10;
 const nerd=readSet().size>=NERD.length;
 const want={"a-ch-ports":ports,"a-ch-ten":ten,"a-ex-nerd":nerd};
 for(const [id,ok] of Object.entries(want)){
  const h=!!S.ach[me]?.[id];
  if(ok&&!h){autoBusy=true;send({op:"ach",id,on:true}).finally(()=>{autoBusy=false});celebrate(id);return}
  if(!ok&&h&&id!=="a-ex-nerd"){autoBusy=true;send({op:"ach",id,on:false}).finally(()=>{autoBusy=false});return}
 }
}
let lastTier=null;
function checkLevel(){if(!me)return;const t=tierOf(countOf(me));if(lastTier!=null&&t>lastTier){toast(`Level up: ${TIERS[t].name}! ${["","🎅","🌿","💡","✨","👑"][t]}`);setTimeout(()=>document.querySelectorAll(`[data-np="${me}"]`).forEach(el=>{el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}),60);confetti(90)}lastTier=t}

/* ================= RENDER ALL ================= */
function renderAll(){
 const ids=["pl-day","pl-time","pl-what","where-custom"];const keep={};ids.forEach(i=>{const el=document.getElementById(i);if(el)keep[i]=el.value});
 const act=document.activeElement?.id;const nerdOpen=document.getElementById("nerd")?.open;
 const openSecrets=[...document.querySelectorAll("section.panel details.secret")].map(d=>d.open);const y=scrollY;
 if(windyFrame)windyFrame.remove();
 renderHome();if(windyFrame){const sl=document.getElementById("windy-slot");if(sl)sl.replaceWith(windyFrame)}
 renderPlan();["cabo","maz","pv"].forEach(renderPort);renderShip();renderMap();renderLegends();
 ids.forEach(i=>{const el=document.getElementById(i);if(el&&keep[i]!=null)el.value=keep[i]});
 if(nerdOpen)document.getElementById("nerd").open=true;
 const ds=[...document.querySelectorAll("section.panel details.secret")];if(ds.length===openSecrets.length)ds.forEach((d,i)=>{if(openSecrets[i])d.open=true});
 if(act&&ids.includes(act))document.getElementById(act)?.focus();
 if(Math.abs(scrollY-y)>2)scrollTo(0,y);
}
let rq=false;function afterChange(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;renderAll();checkLevel();reconcileAuto()})}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
 const pr=e.target.closest?.("svg[data-profile]");if(pr){const r=pr.getBoundingClientRect();const y=(e.clientY-r.top)/r.height*300;let best=shipDeck,bd=1e9;DECKS.forEach(([n])=>{const dd=Math.abs(PROF[n][0]-y);if(dd<bd){bd=dd;best=n}});shipDeck=best;LS.set("deck",shipDeck);renderAll();return}
 const t=e.target.closest("[data-go],[data-me],[data-want],[data-quest],[data-filt],[data-where],[data-del],[data-witness],[data-cabinet],[data-equip],[data-undo],[data-close],[data-ovl],[data-venue],[data-deck],[data-vcat],[data-checkin],[data-deckstep],[data-showdeck],[data-venue-go],[data-np],[data-proof],[data-addproof],[data-pin],[data-unproof],#where-go,#pl-add");
 if(!t)return;
 if(t.matches("[data-ovl]")){if(e.target===t)closeModal();return}
 if(t.dataset.close!==undefined){closeModal();return}
 if(t.dataset.go){e.preventDefault();return go(t.dataset.go,t.dataset.anchor)}
 if(t.dataset.me){me=t.dataset.me;LS.set("me",me);lastTier=tierOf(countOf(me));afterChange();toast("Hola, "+me+" 👋");return}
 if(t.dataset.want){if(needMe())return;const on=!(S.picks[t.dataset.want]||[]).includes(me);send({op:"pick",id:t.dataset.want,on});toast(on?"You're in! Moved up the list 🚀":"Removed");return}
 if(t.dataset.quest){closeModal();return tapQuest(t.dataset.quest)}
 if(t.dataset.filt){const[pk,f]=t.dataset.filt.split(":");filt[pk]=f;return renderAll()}
 if(t.dataset.where){if(needMe())return;send({op:"status",where:t.dataset.where});return toast("Crew can see you're at: "+t.dataset.where)}
 if(t.dataset.del){return send({op:"unplan",id:t.dataset.del})}
 if(t.dataset.witness){if(needMe())return;send({op:"witness",id:t.dataset.witness,target:t.dataset.target});toast(`Witnessed! ${t.dataset.target} unlocked ${ACHBY[t.dataset.witness].t} 🎉`);confetti(120);return}
 if(t.dataset.cabinet){return openCabinet(t.dataset.cabinet)}
 if(t.dataset.equip!==undefined){if(needMe())return;send({op:"title",id:t.dataset.equip||null});closeModal();return toast(t.dataset.equip?`Equipped: ${ACHBY[t.dataset.equip].t}`:"Title removed")}
 if(t.dataset.undo){send({op:"ach",id:t.dataset.undo,on:false});closeModal();return toast("Undone")}
 if(t.dataset.proof){return openProof(t.dataset.proof)}
 if(t.dataset.addproof){if(needMe())return;return openAddProof(t.dataset.addproof)}
 if(t.dataset.pin!==undefined){if(needMe())return;const p=S.proofs.find(x=>x.id===(t.dataset.pin||S.pins[me]));send({op:"pin",id:t.dataset.pin||null});toast(t.dataset.pin?"📌 Pinned as your Defining Moment":"Unpinned");return openCabinet(me)}
 if(t.dataset.unproof){if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="Tap again to remove";return}const p=S.proofs.find(x=>x.id===t.dataset.unproof);if(p){send({op:"unproof",id:p.id});removePhoto(p.photo);toast("Removed");return openCabinet(p.about)}return closeModal()}
 if(t.dataset.venue){return openVenue(t.dataset.venue)}
 if(t.dataset.deckstep){const i=DIDX[shipDeck]+ +t.dataset.deckstep;if(DECKS[i]){shipDeck=DECKS[i][0];LS.set("deck",shipDeck);renderAll()}return}
 if(t.dataset.deck){shipDeck=+t.dataset.deck;LS.set("deck",shipDeck);return renderAll()}
 if(t.dataset.vcat){vcat=t.dataset.vcat;if(vcat==="cabin"){shipDeck=15;LS.set("deck",15)}return renderAll()}
 if(t.dataset.checkin){if(needMe())return;const v=VBY[t.dataset.checkin];send({op:"status",where:`📍 ${v.n} (Deck ${v.d})`,venue:v.id});closeModal();return toast("Checked in at "+v.n)}
 if(t.dataset.showdeck){shipDeck=+t.dataset.showdeck;LS.set("deck",shipDeck);closeModal();renderAll();return go("map")}
 if(t.dataset.venueGo){e.preventDefault();const v=VBY[t.dataset.venueGo];if(v?.d){shipDeck=v.d;LS.set("deck",v.d);renderAll()}return go("map")}
 if(t.dataset.np&&!t.dataset.me){const L=t.closest("[data-cabinet]");if(L)return openCabinet(L.dataset.cabinet);t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");return}
 if(t.id==="where-go"){if(needMe())return;const v=$("#where-custom").value.trim();if(!v)return;$("#where-custom").value="";send({op:"status",where:v});return toast("Crew can see you're at: "+v)}
 if(t.id==="pl-add"){if(needMe())return;const what=$("#pl-what").value.trim();if(!what)return toast("Type what's happening first");send({op:"plan",day:$("#pl-day").value,time:$("#pl-time").value.trim(),what});$("#pl-what").value="";$("#pl-time").value="";return toast("Added to the schedule 📅")}
});
document.addEventListener("submit",e=>{if(e.target.id==="proof-form"){e.preventDefault();submitProof()}});
document.addEventListener("change",e=>{if(e.target.id==="proof-file"){const f=e.target.files[0],img=$("#proof-prev");if(f&&img){img.src=URL.createObjectURL(f);img.hidden=false}return}if(e.target.id==="deck-sel"){shipDeck=+e.target.value;LS.set("deck",shipDeck);renderAll();return}if(e.target.id==="venue-pick"&&e.target.value){if(needMe()){e.target.value="";return}const v=VBY[e.target.value];send({op:"status",where:`📍 ${v.n} (Deck ${v.d})`,venue:v.id});toast("Checked in at "+v.n)}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches?.("details.ncard")&&d.open){if(!me){toast("Pick your name so your reading counts 👆");return}const s=readSet();const i=+d.dataset.nerd;if(!s.has(i)){s.add(i);LS.set(readKey(),JSON.stringify([...s]));d.classList.add("read");const sum=document.querySelector("#nerd>summary");if(sum)sum.textContent=`🤓 Ship Nerd Mode · ${s.size}/${NERD.length} read`;reconcileAuto()}}},true);
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeModal();
 if(e.key==="Enter"||e.key===" "){const g=e.target.closest?.(".stop,.deckband,.vmark");if(g){e.preventDefault();g.click()}}
 if(e.key==="Enter"){if(e.target.id==="where-custom")$("#where-go").click();if(e.target.id==="pl-what")$("#pl-add").click()}
});

/* ================= BOOT ================= */
loadLocal();lastTier=me?tierOf(countOf(me)):null;
renderTabs();renderAll();go(tab);
if(STANDALONE){pull();setInterval(()=>{if(!document.hidden)pull()},10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});setTimeout(()=>{if(!ready){ready=true;reconcileAuto()}},6000)}
else{(async()=>{try{db=await window.claude.use("db")}catch(e){db=null}if(db){mode="db";dbSubscribe()}else{ready=true;afterChange()}})()}
</script>
