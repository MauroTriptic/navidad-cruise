<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Navidad Riviera Cruise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: sticky pill tab bar; each port panel re-themes the same card system with its own local art palette */
:root{
  color-scheme: light;
  --bg:#F3FBFA; --ink:#1E1240; --soft:#5C527A; --line:#1E1240;
  --pink:#FF3D7F; --sun:#FFC21A; --teal:#00B3A6; --orange:#FF7A1A; --violet:#7B4DFF;
  --card:#FFFFFF; --chip:#EDF6F5;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --p1:var(--pink); --p2:var(--sun); --p3:#FFE6EF; --pink-ink:#fff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* tab bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ink)}
.bar .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.bar .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-family:var(--display);font-size:15px;border:2px solid transparent;border-radius:999px;padding:7px 14px;background:#2E2160;color:#fff;cursor:pointer;transition:transform .12s}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{background:var(--tc,var(--sun));color:var(--ink);border-color:#fff}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

main{padding-block:18px 60px}
section.panel{display:flex;flex-direction:column;gap:18px}

/* who am I */
.me-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:800}
.me-strip .lbl{font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.8px}
.face{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px 4px 4px;background:#fff;font-weight:800;cursor:pointer;font-family:var(--body);font-size:14px;color:var(--ink)}
.face i{width:24px;height:24px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;font-weight:900}
.face[aria-pressed="true"]{background:var(--c);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.face[aria-pressed="true"] i{background:#fff;color:var(--c)}

/* hero */
.hero{position:relative;border:3px solid var(--ink);border-radius:26px;overflow:hidden;background:linear-gradient(160deg,#00B3A6 0%,#14C2D1 40%,#FFC21A 100%);color:var(--ink);box-shadow:6px 6px 0 var(--ink)}
.hero-in{position:relative;padding:22px 20px 20px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}
.hero h1{font-size:clamp(40px,10vw,74px);line-height:.92;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.hero p{margin:0;font-weight:700;max-width:46ch}
.count{display:flex;gap:10px;flex-wrap:wrap}
.count div{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 12px;text-align:center;min-width:70px}
.count b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.hero .sunburst{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:repeating-conic-gradient(var(--pink) 0 10deg,transparent 10deg 20deg);opacity:.35}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.box{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:4px 4px 0 var(--ink);min-width:0}
.box h2{font-size:24px;margin-bottom:8px}
.sub{color:var(--soft);font-size:13px;font-weight:700;margin:0}

/* port chips (weather) */
.ports{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pchip{display:flex;flex-direction:column;gap:2px;text-decoration:none;border:2px solid var(--ink);border-radius:16px;padding:10px 12px;background:var(--pc);color:var(--ink);transition:transform .12s}
.pchip:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
.pchip b{font-family:var(--display);font-size:18px}
.pchip .t{font-family:var(--mono);font-size:12px}
.pchip .w{font-weight:800;font-size:13px}

/* map */
.map svg{width:100%;height:auto;display:block}
.map .stop{cursor:pointer}

/* hot list */
.hot{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.hot li{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:14px;padding:8px 10px;background:var(--hc,#fff);min-width:0}
.hot .n{font-family:var(--display);font-size:20px;width:28px;text-align:center;flex:0 0 auto}
.hot .tt{flex:1;min-width:0;font-weight:800}
.hot .tt small{display:block;font-weight:700;color:var(--soft)}
.dots{display:flex}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid #fff;margin-left:-6px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:10px;font-weight:900}
.dots i:first-child{margin-left:0}
.empty{border:2px dashed var(--soft);border-radius:14px;padding:12px;color:var(--soft);font-weight:700;margin:0}

/* status */
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{border:2px solid var(--ink);border-radius:14px;padding:10px;background:#fff;min-width:0}
.st .nm{display:flex;align-items:center;gap:6px;font-weight:900}
.st .nm i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.st .where{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.st .ago{font-size:12px;color:var(--soft);font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qbtn,.btn{font-family:var(--body);font-weight:900;font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:7px 13px;background:#fff;color:var(--ink);cursor:pointer;transition:transform .1s, box-shadow .1s}
.qbtn:hover,.btn:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.qbtn:active,.btn:active{transform:translate(1px,1px);box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input[type=text],select{font-family:var(--body);font-size:15px;font-weight:700;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0}
.row input[type=text]{flex:1 1 160px}

/* port hero */
.phero{position:relative;border:3px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);color:var(--ink)}
.phero .in{position:relative;padding:20px;display:flex;flex-direction:column;gap:8px;z-index:1}
.phero h1{font-size:clamp(38px,9vw,64px);line-height:.95}
.phero .times{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-family:var(--mono);font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:#fff;color:var(--ink)}
.pill.warn{background:var(--sun)}
.phero .art{position:absolute;right:0;bottom:0;width:min(46%,280px);height:auto;opacity:.95}
.phero p.blurb{margin:0;font-weight:700;max-width:52ch;position:relative}

/* port themes */
.th-cabo{--p1:#1546C7;--p2:#FF6B3D;--p3:#FFE1C9}
.th-cabo .phero{background:linear-gradient(180deg,#FF9A5C 0%,#FF6B3D 38%,#C2307A 70%,#1546C7 100%);color:#fff}
.th-cabo .phero h1{color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.th-maz{--p1:#2C3E9A;--p2:#F47CA6;--p3:#E3F6F2}
.th-maz .phero{background:#BFEDE6}
.th-maz .phero h1{color:#2C3E9A}
.th-pv{--p1:#E6007E;--p2:#00A6D6;--p3:#FFF6C2}
.th-pv .phero{background:#FFD200}
.th-pv .phero::before{content:"";position:absolute;inset:0;background:
  conic-gradient(from 45deg at 50% 50%,#E6007E 0 25%,#00A6D6 0 50%,#00A651 0 75%,#FF7A1A 0) 0 0/36px 36px;opacity:.28;-webkit-mask:linear-gradient(90deg,transparent 30%,#000 100%);mask:linear-gradient(90deg,transparent 30%,#000 100%)}
.th-pv .phero h1{color:#E6007E;-webkit-text-stroke:1.5px var(--ink)}
.th-ship{--p1:#12245B;--p2:#E8384F;--p3:#E8EEFF}
.th-ship .phero{background:radial-gradient(circle at 20% 20%,#2C4AA8,#12245B 70%);color:#fff}
.th-ship .phero h1{color:#FFD45A;text-shadow:3px 3px 0 #000}

.papel{display:flex;position:relative;z-index:1;margin:-3px -3px 0}
.papel span{flex:1;height:34px;clip-path:polygon(0 0,100% 0,100% 70%,85% 100%,70% 70%,50% 100%,30% 70%,15% 100%,0 70%);border-right:2px solid transparent}

.tip{border:2px solid var(--ink);border-radius:16px;background:var(--p3);padding:12px 14px;font-weight:700;display:flex;gap:10px}
.tip b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--p1)}

/* quests */
.quests{display:flex;flex-wrap:wrap;gap:8px}
.quest{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;padding:6px 12px 6px 6px;background:#fff;cursor:pointer;font-family:var(--body);font-weight:800;font-size:14px;color:var(--ink)}
.quest .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;background:#fff}
.quest.done .ck{background:var(--p2);color:#fff}
.quest .dots i{width:18px;height:18px;font-size:9px}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;font-family:var(--body);font-weight:900;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;background:#fff;color:var(--ink);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--p1);color:#fff}

/* activity cards */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.act{display:flex;flex-direction:column;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:4px 4px 0 var(--p1);min-width:0;position:relative}
.act.voted{background:var(--p3)}
.act .rank{position:absolute;top:-12px;right:12px;background:var(--p2);color:#fff;border:2px solid var(--ink);border-radius:999px;font-family:var(--display);font-size:13px;padding:2px 10px}
.act h3{font-size:20px;line-height:1.1}
.act p{margin:0;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:900;border-radius:999px;padding:2px 9px;background:var(--chip);border:1.5px solid var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;font-weight:800;color:var(--soft)}
.meta a{color:var(--p1)}
.act-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px}
.want{font-family:var(--display);font-size:16px;border:2.5px solid var(--ink);border-radius:999px;padding:7px 14px;background:var(--p2);color:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .1s, box-shadow .1s;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.want:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.want.on{background:var(--ink);color:#fff}
.want:disabled{opacity:.5;cursor:not-allowed}
.extlinks{display:flex;flex-wrap:wrap;gap:8px}
.ext{font-weight:900;font-size:13px;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;background:#fff}
.ext:hover{background:var(--p3)}

/* schedule */
.days{display:flex;flex-direction:column;gap:14px}
.day{display:grid;grid-template-columns:76px 1fr;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:4px 4px 0 var(--dc)}
.date{border:2px solid var(--ink);border-radius:14px;background:var(--dc);text-align:center;padding:6px 4px;align-self:start;color:var(--ink)}
.date b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.date span{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.day h3{font-size:21px}
.day .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.day ul{margin:0;padding-left:18px;font-size:14px;font-weight:700}
.day .plan{display:flex;gap:8px;align-items:baseline;font-size:14px;font-weight:700}
.day .plan .tm{font-family:var(--mono);font-size:12px;color:var(--soft);flex:0 0 auto}
.day .plan .x{border:0;background:none;color:var(--soft);cursor:pointer;font-weight:900;font-size:14px;padding:0 4px}
.lab{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--soft)}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{font-size:12.5px;font-weight:800;border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px;background:var(--bg)}

.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;border-radius:999px;padding:9px 16px;z-index:20;max-width:calc(100% - 32px)}
.note{font-size:12.5px;color:var(--soft);font-weight:700;margin:0}
footer{padding-block:10px 30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.day{grid-template-columns:1fr}.date{display:flex;gap:8px;align-items:baseline;justify-content:center}.phero .art{width:42%;opacity:.6}}
</style>
</head>

 cabo:{name:"Cabo San Lucas",short:"Cabo",date:"Mon Dec 21",time:"12:00 PM – 8:00 PM",pc:"#FFB48A",hi:"27°",lo:"17°",sea:"24°",

 maz:`<svg class="art" viewBox="0 0 280 200" aria-hidden="true"><path d="M70 200 C 110 110, 170 90, 280 96 L 280 200 Z" fill="#7FCF9B" stroke="#1E1240" stroke-width="3"/><rect x="196" y="40" width="22" height="58" fill="#fff" stroke="#1E1240" stroke-width="3"/><rect x="190" y="30" width="34" height="14" rx="3" fill="#F47CA6" stroke="#1E1240" stroke-width="3"/><path d="M196 34 L 120 10 L 120 52 Z" fill="#FFE08A" opacity=".7"/><path d="M0 182 C 50 172, 100 192, 150 182 S 230 174, 280 186 L 280 200 L 0 200 Z" fill="#2C3E9A" stroke="#1E1240" stroke-width="3"/></svg>`,
 pv:`<svg class="art" viewBox="0 0 280 200" aria-hidden="true"><g stroke="#1E1240" stroke-width="3" fill="#fff"><path d="M60 200 V120 A40 40 0 0 1 140 120 V200 H124 V124 A24 24 0 0 0 76 124 V200 Z"/><path d="M150 200 V140 A34 34 0 0 1 218 140 V200 H204 V144 A20 20 0 0 0 164 144 V200 Z"/><path d="M226 200 V156 A26 26 0 0 1 278 156 V200 H266 V160 A14 14 0 0 0 238 160 V200 Z"/></g><circle cx="100" cy="70" r="16" fill="#E6007E" stroke="#1E1240" stroke-width="3"/><circle cx="184" cy="92" r="12" fill="#00A6D6" stroke="#1E1240" stroke-width="3"/><circle cx="252" cy="118" r="9" fill="#00A651" stroke="#1E1240" stroke-width="3"/></svg>`,
 ship:`<svg class="art" viewBox="0 0 280 200" aria-hidden="true"><g fill="#FFD45A"><circle cx="40" cy="30" r="2"/><circle cx="90" cy="18" r="1.6"/><circle cx="150" cy="40" r="2.2"/><circle cx="230" cy="22" r="1.8"/><circle cx="260" cy="60" r="1.4"/></g><path d="M30 150 L 260 150 L 236 186 L 52 186 Z" fill="#fff" stroke="#000" stroke-width="3"/><rect x="70" y="118" width="160" height="32" fill="#fff" stroke="#000" stroke-width="3"/><rect x="100" y="94" width="104" height="24" fill="#fff" stroke="#000" stroke-width="3"/><g fill="#12245B">${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${80+i*18}" y="128" width="10" height="10" rx="2"/>`).join("")}</g><path d="M160 94 L 160 60 L 186 94 Z" fill="#2E8B57" stroke="#000" stroke-width="2.5"/><circle cx="160" cy="58" r="5" fill="#FFD45A" stroke="#000" stroke-width="2"/><path d="M0 186 C 60 176, 120 196, 180 186 S 250 178, 280 190 L 280 200 L 0 200 Z" fill="#1F3E8C"/></svg>`
};
const PAPEL=["#F47CA6","#FFE08A","#8FD6CF","#B9A3FF","#FF9F6B","#7FCF9B"];

function renderPort(pk){
 const p=PORTS[pk];const f=filt[pk]||"all";
 const tagsHere=[...new Set(p.acts.flatMap(a=>a.tags))];
 const list=ranked(p.acts).filter(a=>f==="all"||a.tags.includes(f));
 const top=ranked(p.acts).filter(a=>picks[a.id]?.size).slice(0,3);
 $("#p-"+pk).innerHTML=`
 <div class="phero">${pk==="maz"?`<div class="papel">${PAPEL.concat(PAPEL).map(c=>`<span style="background:${c}"></span>`).join("")}</div>`:""}
  <div class="in"><span class="eyebrow">${esc(p.date)}${p.tz?" · "+esc(p.tz):""}</span><h1>${esc(p.name)}</h1>
  <div class="times"><span class="pill">${esc(p.time)}</span>${pk==="cabo"?'<span class="pill warn">Tender port</span>':""}${pk==="ship"?'<span class="pill warn">🎄 Christmas at sea</span>':""}</div>
  <p class="blurb">${esc(p.blurb)}</p></div>${ART[pk]}</div>
 ${meStrip()}
 <div class="tip"><span>💡</span><div><b>${esc(p.tip[0])}</b><br>${esc(p.tip[1])}</div></div>
 <div class="box"><h2>Side quests</h2><p class="sub">Tap when you've done it. Bragging rights only.</p>
  <div class="quests" style="margin-top:10px">${p.quests.map(([id,l])=>{const s=quests[id];const done=me&&s?.has(me);return `<button class="quest ${done?"done":""}" data-quest="${id}"><span class="ck">${done?"✓":""}</span>${esc(l)}${dots(s)}</button>`}).join("")}</div></div>
 ${top.length?`<div class="box"><h2>We're doing…</h2><ol class="hot">${top.map((a,i)=>`<li style="--hc:${p.pc}"><span class="n">${i+1}</span><span class="tt">${esc(a.t)}</span>${dots(picks[a.id])}</li>`).join("")}</ol></div>`:""}
 <div style="display:flex;flex-direction:column;gap:10px">
  <h2 style="font-size:28px">${pk==="ship"?"Onboard fun":"Things to do"}</h2>
  <div class="filters">${["all",...tagsHere].map(t=>`<button class="fchip" aria-pressed="${f===t}" data-filt="${pk}:${t}">${t==="all"?"✨ Everything":TAGS[t]}</button>`).join("")}</div>
 </div>
 <div class="acts">${list.map(a=>actCard(a,pk)).join("")}</div>
 ${p.q?`<div class="box"><h2>Dig deeper</h2><p class="sub">Fresh takes from other cruisers and top-rated tours.</p><div class="extlinks" style="margin-top:10px">
  <a class="ext" target="_blank" rel="noopener" href="https://www.reddit.com/r/Cruise/search/?q=${encodeURIComponent(p.q)}">Reddit r/Cruise ↗</a>
  <a class="ext" target="_blank" rel="noopener" href="https://www.reddit.com/search/?q=${encodeURIComponent(p.q+" cruise port day")}">Reddit port-day threads ↗</a>
  <a class="ext" target="_blank" rel="noopener" href="https://www.tripadvisor.com/Search?q=${encodeURIComponent(p.q+" things to do")}">TripAdvisor top things ↗</a>
  <a class="ext" target="_blank" rel="noopener" href="${M(p.q+" Mexico")}">📍 Open map ↗</a>
  <a class="ext" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent("weather "+p.name+" Mexico")}">☀️ Live weather ↗</a>
 </div></div>`:""}`;
}

/* ---------- schedule ---------- */
function renderPlan(){
 $("#p-plan").innerHTML=`
 <div class="hero" style="background:linear-gradient(160deg,#7FE3D9,#C9D6FF)"><div class="hero-in"><span class="eyebrow">Dec 18 – 26</span><h1 style="font-size:clamp(36px,9vw,60px)">The Week</h1><p>Port times come from the booking. Crew picks and your own plans drop in under each day automatically.</p></div></div>
 ${meStrip()}
 <div class="box"><h2>Add a plan</h2><p class="sub">Dinner reservation, spa slot, "meet at the hot tub at 10". Anything goes.</p>
  <div class="row"><select id="pl-day" aria-label="Day">${DAYS.map(d=>`<option value="${d.k}">${d.wd} Dec ${d.dn}</option>`).join("")}</select><input type="text" id="pl-time" maxlength="12" placeholder="Time, e.g. 7:30 PM" style="flex:0 1 140px"></div>
  <div class="row"><input type="text" id="pl-what" maxlength="90" placeholder="What's happening?"><button class="btn" id="pl-add" style="background:var(--sun)">Add it</button></div>
 </div>
 <div class="days">${DAYS.map(d=>{
  const mine=plans.filter(x=>x.day===d.k);
  const ps=d.port?ranked(PORTS[d.port].acts).filter(a=>picks[a.id]?.size):[];
  return `<div class="day" style="--dc:${d.dc}"><div class="date"><span>${d.wd}</span><b>${d.dn}</b><span>Dec</span></div>
  <div class="body"><h3>${esc(d.t)}</h3><ul>${d.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
  ${d.port&&d.port!=="ship"?`<p class="note">All-aboard is usually 30 min before departure. Confirm in the daily planner.</p>`:""}
  ${ps.length?`<span class="lab">Crew picks</span><div class="mini">${ps.map(a=>`<span>${esc(a.t)} · ${picks[a.id].size}</span>`).join("")}</div>`:""}
  ${mine.length?`<span class="lab">Plans</span>${mine.sort((a,b)=>String(a.time).localeCompare(String(b.time))).map(x=>`<div class="plan"><span class="tm">${esc(x.time||"any time")}</span><span style="flex:1;min-width:0">${esc(x.what)} <span class="dots" style="display:inline-flex;vertical-align:middle">${dots(new Set([x.who]))}</span></span>${x.who===me?`<button class="x" data-del="${x.id}" aria-label="Delete plan">✕</button>`:""}</div>`).join("")}`:""}
  ${d.port?`<button class="qbtn" style="align-self:flex-start" data-go="${d.port}">See ${PORTS[d.port].short} ideas →</button>`:""}
  </div></div>`}).join("")}</div>`;
}

function renderAll(){
 const ids=["pl-day","pl-time","pl-what","where-custom"];const keep={};ids.forEach(i=>{const el=document.getElementById(i);if(el)keep[i]=el.value});
 const act=document.activeElement?.id;
 renderHome();renderPlan();["cabo","maz","pv","ship"].forEach(renderPort);saveLocal();
 ids.forEach(i=>{const el=document.getElementById(i);if(el&&keep[i]!=null)el.value=keep[i]});
 if(act&&ids.includes(act))document.getElementById(act)?.focus();
}

/* ---------- actions ---------- */
async function toggleWant(id){
 if(needMe())return;const s=picks[id]||(picks[id]=new Set());const on=s.has(me);
 if(on)s.delete(me);else s.add(me);renderAll();
 toast(on?"Removed":"You're in! Moved up the list 🚀");
 if(db){const ref=db.doc("picks/"+id+"__"+me);try{on?await ref.delete():await ref.set({act:id,who:me,ts:Date.now()})}catch(e){toast("Couldn't save. Check your connection.")}}else push({op:"pick",id,on:!on});
}
async function toggleQuest(id){
 if(needMe())return;const s=quests[id]||(quests[id]=new Set());const on=s.has(me);
 if(on)s.delete(me);else s.add(me);renderAll();if(!on)toast("Side quest complete ⭐");
 if(db){const ref=db.doc("quests/"+id+"__"+me);try{on?await ref.delete():await ref.set({q:id,who:me,ts:Date.now()})}catch(e){toast("Couldn't save. Check your connection.")}}else push({op:"quest",id,on:!on});
}
async function setWhere(w){
 if(needMe())return;w=w.trim();if(!w)return;status[me]={where:w,ts:Date.now()};renderAll();toast("Crew can see you're at: "+w);
 if(db){try{await db.doc("status/"+me).set({who:me,where:w,ts:Date.now()})}catch(e){toast("Couldn't save. Check your connection.")}}else push({op:"status",where:w});
}
async function addPlan(){
 if(needMe())return;const what=$("#pl-what").value.trim();if(!what){toast("Type what's happening first");return}
 const rec={day:$("#pl-day").value,time:$("#pl-time").value.trim(),what,who:me,ts:Date.now()};
 if(db){try{const ref=await db.collection("plans").add(rec);rec.id=ref.id}catch(e){toast("Couldn't save. Check your connection.");return}}
 else if(apiOk){await push({op:"plan",day:rec.day,time:rec.time,what:rec.what})}else{rec.id="l"+rec.ts;plans.push(rec)}
 $("#pl-what").value="";$("#pl-time").value="";renderAll();toast("Added to the schedule 📅");
}
async function delPlan(id){plans=plans.filter(p=>p.id!==id);renderAll();if(db){try{await db.doc("plans/"+id).delete()}catch(e){}}else push({op:"unplan",id});}

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-me],[data-want],[data-quest],[data-filt],[data-where],[data-del],#where-go,#pl-add");if(!t)return;
 if(t.dataset.go)return go(t.dataset.go);
 if(t.dataset.me){me=t.dataset.me;LS.set("me",me);renderAll();return toast("Hola, "+me+" 👋")}
 if(t.dataset.want)return toggleWant(t.dataset.want);
 if(t.dataset.quest)return toggleQuest(t.dataset.quest);
 if(t.dataset.filt){const[pk,f]=t.dataset.filt.split(":");filt[pk]=f;return renderPort(pk)}
 if(t.dataset.where)return setWhere(t.dataset.where);
 if(t.dataset.del)return delPlan(t.dataset.del);
 if(t.id==="where-go"){const v=$("#where-custom").value;$("#where-custom").value="";return setWhere(v)}
 if(t.id==="pl-add")return addPlan();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const g=e.target.closest?.(".stop");if(g)go(g.dataset.go);if(e.target.id==="where-custom")$("#where-go").click();if(e.target.id==="pl-what")addPlan()}});

/* ---------- boot ---------- */
if(STANDALONE){loadLocal();pull();setInterval(()=>{if(!document.hidden)pull()},10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()})}
renderTabs();renderAll();go(tab);
(async()=>{
 try{db=window.claude?.use?await window.claude.use("db"):null}catch(e){db=null}
 if(!db)return;live=true;
 const err=()=>{};
 db.collection("picks").onSnapshot(s=>{const n={};s.docs.forEach(d=>{const x=d.data();if(x&&x.act&&x.who)(n[x.act]||(n[x.act]=new Set())).add(x.who)});picks=n;renderAll()},err);
 db.collection("quests").onSnapshot(s=>{const n={};s.docs.forEach(d=>{const x=d.data();if(x&&x.q&&x.who)(n[x.q]||(n[x.q]=new Set())).add(x.who)});quests=n;renderAll()},err);
 db.collection("plans").onSnapshot(s=>{plans=s.docs.map(d=>({...d.data(),id:d.id})).filter(x=>x.what);renderAll()},err);
 db.collection("status").onSnapshot(s=>{const n={};s.docs.forEach(d=>{const x=d.data();if(x&&x.who)n[x.who]=x});status=n;renderAll()},err);
})();
</script>
